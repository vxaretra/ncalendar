#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Compose Hot Reload
# The bundled hot-reload plugin (1.2.0) provisions a JetBrains Runtime for hotRun and
# defaults to compose.reload.jbr.version=25, whose build crashes the hot-reload agent
# during JVM startup (ClassCircularityError: jdk/internal/vm/ContinuationSupport) before
# any app code runs. Compose Hot Reload supports JBR 21, so pin it here. Remove this once
# a newer hot-reload version supports JBR 25.
#compose.reload.jbr.version=21
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true